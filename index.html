<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Grid Warrior — Ruins of the Meadow</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1a2333;touch-action:none;
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;-webkit-user-select:none;user-select:none}
  #game{display:block;width:100vw;height:100vh}
  .tbtn{position:fixed;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.45);
    color:#fff;font-weight:900;display:none;align-items:center;justify-content:center;z-index:10;
    -webkit-tap-highlight-color:transparent}
  #btnA{right:26px;bottom:100px;width:84px;height:84px;font-size:26px}
  #btnB{right:118px;bottom:38px;width:66px;height:66px;font-size:18px}
  #stickZone{left:0;bottom:0;width:45vw;height:55vh;position:fixed;z-index:9;display:none}
  .touch .tbtn,.touch #stickZone{display:flex}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="stickZone"></div>
<div id="btnA" class="tbtn">⚔</div>
<div id="btnB" class="tbtn">➜</div>
<script src="js/core.js"></script>
<script src="js/game.js"></script>
</body>
</html>
